version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: gungnir_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: gungnir_telemetry
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gungnir_network

  redis_cache:
    image: redis:7-alpine
    container_name: gungnir_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - gungnir_network

  api_app:
    image: python:3.11-slim
    container_name: gungnir_api
    volumes:
      - ./app:/app
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python database.py && uvicorn main:app --host 0.0.0.0 --port 8000"
    environment:
      - REDIS_HOST=${REDIS_HOST}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres_db
      - redis_cache
    networks:
      - gungnir_network

  telemetry_worker:
    image: python:3.11-slim
    container_name: gungnir_worker
    pid: "host"  
    volumes:
      - ./app:/app
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python collector.py"
    environment:
      - REDIS_HOST=${REDIS_HOST}
    depends_on:
      - redis_cache
    networks:
      - gungnir_network

  nginx_proxy:
    image: nginx:alpine
    container_name: gungnir_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api_app
    networks:
      - gungnir_network

volumes:
  postgres_data:
  redis_data:

networks:
  gungnir_network:
    driver: bridge
